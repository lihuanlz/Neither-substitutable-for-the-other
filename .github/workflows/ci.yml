name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lean:
    name: Lean 4 build and proof audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Official Lean action. It installs the toolchain named in
      # `lean-toolchain`, notices the Mathlib dependency and runs
      # `lake exe cache get` before `lake build`, so the job does not spend
      # an hour compiling Mathlib from source.
      - name: Build the proofs
        uses: leanprover/lean-action@v1

      # `lake build` alone only says the kernel accepted the proofs. This asks
      # Lean for the axiom dependencies of all 164 declarations, so a stray
      # `sorry` or an unexplained assumption fails the build instead of
      # quietly weakening a claim.
      - name: Audit axiom dependencies
        run: python tools/audit_axioms.py

      # CITATION.cff, .zenodo.json and the README citation block are what a
      # reference manager and a crawler actually read. A malformed one fails
      # silently everywhere except in the one place you notice it.
      #
      # The manuscript checks that used to live here (final_check.py,
      # verify_dois.py, emit_tex.py --check) were removed with the manuscript
      # sources: `paper/` is no longer tracked, so those scripts cannot run in
      # CI. Every check that remains reads only tracked files.
      - name: Scholarly metadata
        run: |
          python -m pip install --quiet pyyaml
          python tools/check_metadata.py

      # tools/contamination_budget.py transcribes three theorems from
      # Contamination.lean by hand. This step makes it re-read the Lean file and
      # fail if those statements have changed, so the script and the
      # specification cannot drift apart. It is the only check that reads the
      # Lean sources rather than the build products.
      - name: Contamination budget matches the Lean statements
        run: python tools/contamination_budget.py --verify

      # The kernel checks that a proof has the type its statement declares. It
      # cannot check that the statement is the claim the docstring above it
      # makes, and that is where this repository has actually gone wrong: the
      # contamination bound's theorem proved `π * TV₀ ≥ 2δ` while its
      # docstring said the negation, and `accumulate_no_decay` was documented
      # as the case where the human source is reinserted at full weight, which
      # is the case where its weight is zero.
      #
      # tools/statement_adequacy.py compares the two layers: it re-reads the
      # prose formula recorded for each claim and the fragment of the Lean
      # statement it stands for, and fails if either has moved without the
      # other. It also checks the terminology, so one symbol cannot carry two
      # meanings across two docstrings.
      - name: Statement adequacy
        run: python tools/statement_adequacy.py
